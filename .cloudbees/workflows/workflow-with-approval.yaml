apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
metadata:
  stages/v1alpha1:
    - name: Checkout
      jobs:
        - First
        - Approval
        - evidence
        - Approval2
        - always-execute-job
        - terminal-job
    - name: Stage
      jobs:
        - also-always-execute
jobs:
  First:
    steps:
      - run: echo "hello world"
        uses: docker://golang:1.20.3-alpine3.17
        name: Hello world
        shell: sh
  Approval:
    needs: First
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      disallowLaunchByUser: false
      notifyAllEligibleUsers: false
      approvers: 8ac37a60-03d2-11eb-9d67-42010a83ae35
  evidence:
    needs: Approval
    steps:
      - uses: EVIDENCE
  Approval2:
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      disallowLaunchByUser: false
      notifyAllEligibleUsers: false
  always-execute-job:
    steps:
      - run: echo "hello world again"
        uses: docker://golang:1.20.3-alpine3.17
        name: Always execute
        shell: sh
  also-always-execute:
    needs: terminal-job
    steps:
      - run: echo "hello world2"
        uses: docker://golang:1.20.3-alpine3.17
        name: Say hello
        shell: sh
  terminal-job:
    needs:
      - evidence
      - Approval2
      - always-execute-job
    outputs:
      t: a
    steps:
      - name: final-step
        uses: docker://alpine:latest
        run: echo "hello world"
        shell: sh
