apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
metadata:
  stages/v1alpha1:
    - name: Checkout
      jobs:
        - First
        - Approval
        - evidence
        - Approval2
    - name: Stage
      jobs:
        - job
jobs:
  First:
    steps:
      - run: echo "hello world"
        uses: docker://golang:1.20.3-alpine3.17
        name: Hello world
        shell: sh
  Approval:
    needs: First
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      disallowLaunchByUser: false
      notifyAllEligibleUsers: false
      approvers: 8ac37a60-03d2-11eb-9d67-42010a83ae35
  evidence:
    needs: Approval
    steps:
      - uses: EVIDENCE
  Approval2:
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    with:
      disallowLaunchByUser: false
      notifyAllEligibleUsers: false
  job:
    needs:
      - evidence
      - Approval2
    steps:
      - name: Say hello
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo "hello world"
